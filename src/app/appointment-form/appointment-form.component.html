<!-- appointment-form.component.html -->

<!-- Wrapper -->
<div
  class="appointment-wrapper d-flex align-items-center justify-content-center"
>
  <div
    class="appointment-card p-4 shadow-lg animate__animated animate__fadeInUp"
  >
    <h2 class="text-center mb-4 text-primary">
      <i class="fas fa-calendar-check me-2"></i> Book Your Appointment
    </h2>

    <!-- ✅ Form with Angular binding -->
    <form (ngSubmit)="onSubmit()" #appointmentForm="ngForm">
      <!-- Full Name -->
      <div class="form-floating mb-3">
        <input
          type="text"
          id="name"
          name="name"
          class="form-control"
          required
          [(ngModel)]="appointment.name"
          placeholder="Enter your full name"
        />
        <label for="name">Full Name</label>
      </div>

      <!-- Age -->
      <div class="form-floating mb-3">
        <input
          type="number"
          id="age"
          name="age"
          class="form-control"
          required
          [(ngModel)]="appointment.age"
          placeholder="Enter your age"
        />
        <label for="age">Age</label>
      </div>

      <!-- Symptoms -->
      <div class="form-floating mb-3">
        <textarea
          id="symtomps"
          name="symtomps"
          class="form-control"
          required
          rows="3"
          [(ngModel)]="appointment.symtomps"
          placeholder="Describe your symptoms"
        ></textarea>
        <label for="symtomps">Symptoms</label>
      </div>

      <!-- Contact Number -->
      <div class="form-floating mb-3">
        <input
          type="tel"
          id="number"
          name="number"
          class="form-control"
          required
          pattern="[0-9]{10}"
          [(ngModel)]="appointment.number"
          placeholder="Enter your 10-digit mobile number"
        />
        <label for="number">Contact Number</label>
      </div>

      <!-- Email Address -->
      <div class="form-floating mb-3">
        <input
          type="email"
          id="email"
          name="email"
          class="form-control"
          required
          [(ngModel)]="appointment.email"
          placeholder="Enter your email"
        />
        <label for="email">Email Address</label>
      </div>

      <!-- Last Visit -->
      <div class="form-floating mb-3">
        <input
          type="date"
          id="lastVisit"
          name="lastVisit"
          class="form-control"
          [(ngModel)]="appointment.lastVisit"
          placeholder="Select your last visit date"
        />
        <label for="lastVisit">Last Visit</label>
      </div>

      <!-- Appointment Date -->
      <div class="form-floating mb-3">
        <input
          type="date"
          id="date"
          name="date"
          class="form-control"
          required
          [(ngModel)]="appointment.date"
          placeholder="Select appointment date"
        />
        <label for="date">Appointment Date</label>
      </div>

      <!-- Appointment Time -->
      <div class="form-floating mb-3">
        <input
          type="time"
          id="time"
          name="time"
          class="form-control"
          required
          [(ngModel)]="appointment.time"
          placeholder="Select appointment time"
        />
        <label for="time">Appointment Time</label>
      </div>

      <!-- ✅ Submit Button inside Form -->
      <div class="text-center">
        <button
          type="submit"
          class="btn btn-primary btn-lg px-5 shadow-sm submit-btn animate__animated animate__pulse"
          [disabled]="!appointmentForm.form.valid"
        >
          <i class="fas fa-paper-plane me-2"></i> Submit
        </button>
      </div>
    </form>
  </div>
</div>
